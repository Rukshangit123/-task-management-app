<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="container py-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="mb-0">Task Manager</h1>
        <div>
          <button class="btn btn-outline-secondary me-2" id="clear-filters"><i class="bi bi-filter"></i> Clear</button>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Add / Edit Task</h5>
              <form id="task-form" novalidate>
                <input type="hidden" id="task-id">
                <div class="mb-3">
                  <label class="form-label">Title *</label>
                  <input id="title" class="form-control" placeholder="Enter task title" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Description</label>
                  <textarea id="description" class="form-control" rows="3" placeholder="Short description (optional)"></textarea>
                </div>
                <div class="row g-2">
                  <div class="col-6">
                    <label class="form-label">Priority *</label>
                    <select id="priority" class="form-select" required>
                      <option value="">Select priority</option>
                      <option>Low</option>
                      <option>Medium</option>
                      <option>High</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label class="form-label">Due Date *</label>
                    <input id="due_date" type="date" class="form-control" required />
                  </div>
                </div>
                <div class="mb-3 mt-3">
                  <label class="form-label">Status *</label>
                  <select id="status" class="form-select" required>
                    <option>Pending</option>
                    <option>In Progress</option>
                    <option>Completed</option>
                  </select>
                </div>
                <div class="d-flex gap-2 justify-content-end">
                  <button class="btn btn-secondary" id="reset-btn" type="button">Reset</button>
                  <button class="btn btn-primary" id="submit-btn">Add Task</button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card shadow-sm">
            <div class="card-body">
              <div class="row mb-3">
                <div class="col-md-6 mb-2">
                  <label class="form-label">Filter by Priority</label>
                  <select id="filter-priority" class="form-select">
                    <option value="">All</option>
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                  </select>
                </div>
                <div class="col-md-6 mb-2">
                  <label class="form-label">Filter by Status</label>
                  <select id="filter-status" class="form-select">
                    <option value="">All</option>
                    <option>Pending</option>
                    <option>In Progress</option>
                    <option>Completed</option>
                  </select>
                </div>
              </div>
              <div id="tasks-list"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Status Modal -->
      <div class="modal fade" id="statusModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Update Status</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="modal-task-id">
              <label class="form-label">Select new status</label>
              <select id="modal-status" class="form-select">
                <option>Pending</option>
                <option>In Progress</option>
                <option>Completed</option>
              </select>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-primary" id="modal-save-status">Save</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Delete Confirm Modal -->
      <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Confirm Delete</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              Are you sure you want to delete this task?
              <input type="hidden" id="delete-task-id">
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-danger" id="modal-confirm-delete">Delete</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
